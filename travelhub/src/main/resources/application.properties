spring.application.name=veyra
# em producao (Render + Aiven), DB_URL aponta pro host/porta/banco reais do Aiven,
# com sslMode=REQUIRED (o Aiven exige SSL). Local, cai no MySQL da maquina.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travelhub}
# usuario dedicado, com privilegios so no schema certo (nao root) — segue o
# principio do menor privilegio. Local usa travelhub_app; em producao (Aiven), o
# usuario e outro, entao tambem vira variavel de ambiente (DB_USERNAME).
spring.datasource.username=${DB_USERNAME:travelhub_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate (nao "update"): o Hibernate so confere se as entidades batem com o
# schema, nunca mais altera o banco sozinho — toda mudanca de schema agora passa
# por uma migration do Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# baseline-on-migrate: o banco ja existia antes do Flyway entrar no projeto, entao
# a V1 (que reflete o schema que ja estava la) e so "registrada" como aplicada,
# nunca executada de fato nesse banco — evita tentar recriar tabela que ja existe.
# Um banco novo do zero (CI, producao nova) roda a V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Render (e a maioria das plataformas de deploy) injeta a porta real via variavel
# de ambiente PORT — precisa escutar nela, nao numa porta fixa. Em dev local, sem
# PORT definida, cai no 8000 de sempre.
server.port=${PORT:8000}
# stateless (JWT) - nao usamos sessao de servidor, entao nao ha motivo pra persistir sessao em disco
# (evita o bug de checagem de dono de pasta em AppData\Local\Temp quando o terminal roda elevado)
server.servlet.session.persistent=false

# upload de foto de perfil
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

jwt.secret = ${JWT_SECRET}
jwt.expiration = 86400000

# origens permitidas por CORS, separadas por virgula. Em producao, trocar pela
# URL real do frontend publicado (ex: https://travelhub.exemplo.com)
app.cors.allowed-origins=http://localhost:5173

# URL do frontend publicado — usada para montar o link de redefinicao de senha
# (ex: https://travelhub.exemplo.com em producao)
app.frontend-url=http://localhost:5173

# uso atual: grupo pequeno de conhecidos, sem provedor de email configurado ainda.
# login NAO bloqueia por email nao confirmado (o risco que isso mitiga so importa
# pra publico geral/estranho). Voltar pra "true" quando tiver email configurado
# de verdade (dominio verificado) e for abrir o app pra mais gente.
app.auth.exigir-verificacao-email=false

# envio de email — sem provedor configurado por enquanto (ver decisao acima).
# Os fluxos de "esqueci senha"/verificacao continuam funcionando sem quebrar nada,
# so nao entregam email de verdade ainda (falha de envio e silenciosa, so vai pro
# log). Deixe em branco por enquanto; preencher quando escolher um provedor.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:}